    <path d="M37 12 L45 20 H39 C37.9 20 37 19.1 37 18 Z" fill="#b9c2d4"/>
  </g>
  <!-- Normal satirlar -->
  <rect x="21" y="26" width="19" height="2.6" rx="1.3" fill="#8a93a8"/>
  <rect x="21" y="32" width="14" height="2.6" rx="1.3" fill="#8a93a8"/>
  <!-- KIRMIZI MADDE (isaretli satir) -->
