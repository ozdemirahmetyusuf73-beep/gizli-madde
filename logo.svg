<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none" aria-label="Gizli Madde logosu">
  <defs>
    <linearGradient id="kmBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6b7a"/><stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
    <linearGradient id="kmPaper" x1="18" y1="10" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5f0"/>
    </linearGradient>
    <filter id="kmShadow" x="-40%" y="-40%" width="180%" height="180%">
