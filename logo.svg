  <line x1="49.5" y1="49.5" x2="56" y2="56" stroke="#ff4d5e" stroke-width="4" stroke-linecap="round"/>
  <path d="M39.5 43 L42 45.5 L46.5 40.5" stroke="#22d47f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
